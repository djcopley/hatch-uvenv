[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hatch-uvenv"
description = ""
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
authors = [{ name = "Daniel Copley", email = "djcopley@proton.me" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
# hatch~=1.17 already pulls these in, but the plugin imports them directly, so
# declare them explicitly (lower bounds match hatch's own requirements).
dependencies = [
  "hatch~=1.17",
  "packaging>=24.2",
  "platformdirs>=2.5.0",
  "python-discovery>=1.1",
]

[project.entry-points.hatch]
uvenv = "hatch_uvenv.hooks"

[project.urls]
Homepage = "https://github.com/djcopley/hatch-uvenv"
Repository = "https://github.com/djcopley/hatch-uvenv.git"
Issues = "https://github.com/djcopley/hatch-uvenv/issues"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.envs.hatch-test]
default-args = ["tests"]
